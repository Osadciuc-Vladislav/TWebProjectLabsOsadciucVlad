<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YZY VNYL — LOGIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/index.css"> <link rel="stylesheet" href="../assets/css/login.css"> </head>
    
<body id="page-login">
    <header id="main-header">
        <div class="header-inner">
            <a href="../index.html" class="logo">YZY VNYL</a>
            <nav>
                <a href="account.html" class="active">ЛИЧНЫЙ КАБИНЕТ</a>
                <a href="../index.html">ГЛАВНАЯ</a>
                <a href="catalog.html">КАТАЛОГ</a>
                <a href="about.html">О ПРОЕКТЕ</a>
                <a href="cart.html">КОРЗИНА</a>
            </nav>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h1 class="auth-title">LOGIN</h1>
            <form class="auth-form">
                <div class="input-group">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" required placeholder="EMAIL@EXAMPLE.COM">
                </div>
                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="cta-button">ВОЙТИ</button>
            </form>
            <div class="auth-footer">
                <p>НЕТ АККАУНТА? <a href="register.html">СОЗДАТЬ</a></p>
            </div>
        </div>
    </main>

    <footer id="main-footer">
        <div class="footer-content">
            <p>© 2026 YZY VNYL. NO BOXES.</p>
        </div>
    </footer>
    <script src="../assets/js/script.js" defer></script>

</body>
</html>
